html+=section('tools',`🧰 ${L==='ar'?'الأدوات والمهارات':'Tools & Skills'}`,d.catalog,toolCards+`<div class="callout"><strong>${L==='ar'?'أنماط موصى بها:':'Recommended patterns:'}</strong> ${L==='ar'?'بحث عبر المتصفح: browser-use + Playwright + استخراج النص + التحقق من الاستشهادات. البرمجة: Git + GitHub CLI + ripgrep + اختبارات + shell معزول. RAG: LlamaIndex/LangChain + Qdrant/Chroma. وكيل بعيد: Telegram/Discord + webhook + scheduler. تنفيذ آمن: Docker sandbox + موافقة صريحة للأوامر المدمرة.':'Browser research: browser-use + Playwright + extraction + citation checks. Coding: Git + GitHub CLI + ripgrep + tests + isolated shell. RAG: LlamaIndex/LangChain + Qdrant/Chroma. Remote agent: Telegram/Discord + webhook + scheduler. Safe execution: Docker sandbox + explicit approval for destructive commands.'}</div>`);
html+=section('mcp',`🔌 ${d.mcpTitle}`,d.mcpIntro,`<div class="table-wrap"><table class="table"><thead><tr><th>${L==='ar'?'التكامل':'MCP / integration'}</th><th>${L==='ar'?'الفئة':'Category'}</th><th>${L==='ar'?'ما يقدمه':'What it provides'}</th><th>Source</th></tr></thead><tbody>${mcp.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${source(x[3],L==='ar'?'المصدر':'Open')}</td></tr>`).join('')}</tbody></table></div><details><summary>${L==='ar'?'طريقة إعداد MCP':'MCP installation pattern'}</summary><div><ol class="steps">${(L==='ar'?['اقرأ README الخاص بالخادم الأصلي وافحص مصدره.','تحقق من متغيرات البيئة وبيانات الاعتماد المطلوبة.','قيّد مسارات الملفات والمستودعات وقواعد البيانات ووجهات الشبكة قدر الإمكان.','أضف الخادم إلى إعداد MCP الموثق للوكيل.','ابدأ بصلاحيات القراءة فقط عندما تكون متاحة.','اختبر عملية آمنة واحدة قبل منح صلاحيات الكتابة أو العمليات المدمرة.']:['Read the upstream server README and inspect its source.','Check required environment variables and credentials.','Restrict filesystem paths, repositories, databases and network destinations where possible.','Add the server to the agent’s documented MCP configuration.','Start with read-only permissions when supported.','Test one harmless operation before granting write or destructive capabilities.']).map(x=>`<li>${x}</li>`).join('')}</ol></div></details><div class="callout"><strong>🔐 ${L==='ar'?'قائمة أمان MCP':'MCP security checklist'}:</strong> ${L==='ar'?'لا تضع مفاتيح API أو OAuth داخل المستودع. استخدم متغيرات البيئة أو مدير الأسرار. تجنب الوصول غير المقيد للملفات. لا تمنح قاعدة بيانات صلاحيات كتابة إلا عند الحاجة. ثبّت الإصدارات حيث يمكن وراجع التحديثات. أزل الخوادم والبيانات غير المستخدمة.':'Never commit API keys or OAuth tokens. Prefer environment variables or a secret manager. Avoid unrestricted filesystem access. Avoid database write permissions unless required. Pin versions where practical and review updates. Remove unused MCP servers and credentials.'}</div>`);
html+=section('apis',`🆓 ${d.apiTitle}`,d.apiIntro,`<div class="grid">${providers.map(x=>`<article class="card searchable"><h3>${esc(x[0])}</h3><p class="muted">${esc(x[1])}</p><span class="pill">${esc(x[2])}</span>${source(x[3],L==='ar'?'الوثائق الرسمية ←':'Official docs →')}</article>`).join('')}</div><details open><summary>${L==='ar'?'كيف تنشئ وتستخدم مفتاح API':'How to create and use an API key'}</summary><div><ol class="steps">${(L==='ar'?['أنشئ حسابًا لدى المزود.','افتح قسم API Keys / Developer.','أنشئ المفتاح وانسخه بأمان.','خزّنه في متغير بيئة أو مدير أسرار.','اختر نموذجًا متاحًا حاليًا من قائمة المزود.','اضبط الوكيل وفق صيغة API وBase URL ومعرف النموذج الموثق.','اختبر tool calling وطول السياق قبل المهام المستقلة الطويلة.']:['Create an account with the provider.','Open its API-key / developer section.','Create a key and copy it securely.','Store it in an environment variable or secret manager.','Choose a currently available model from the provider’s live list.','Configure the agent with the documented API format, base URL and model ID.','Test tool calling and context length before long autonomous tasks.']).map(x=>`<li>${x}</li>`).join('')}</ol><code class="code">export OPENROUTER_API_KEY="YOUR_KEY"</code><p class="muted">🔒 ${L==='ar'?'لا تضع مفتاح API حقيقيًا في GitHub.':'Never commit a real API key to GitHub.'}</p></div></details><div class="grid"><div class="card"><h3>${L==='ar'?'أسهل بداية':'Easiest start'}</h3><p class="muted">Google AI Studio / Gemini</p></div><div class="card"><h3>${L==='ar'?'استدلال سريع':'Fast inference'}</h3><p class="muted">Groq / Cerebras</p></div><div class="card"><h3>${L==='ar'?'نماذج كثيرة عبر API واحد':'Many models through one API'}</h3><p class="muted">OpenRouter</p></div><div class="card"><h3>${L==='ar'?'تطبيقات Cloudflare':'Cloudflare-native'}</h3><p class="muted">Workers AI</p></div></div>`);
html+=section('installation',`📦 ${d.installTitle}`,'',`<div class="callout">${L==='ar'?'AI Agents Hub دليل وكتالوج؛ التنصيب يتم من المشاريع الأصلية. فضّل دائمًا تعليمات المشروع الأصلي لأن الأوامر تتغير.':'AI Agents Hub is a directory; agents are installed from upstream projects. Prefer upstream instructions because commands change.'}</div><ol class="steps">${(L==='ar'?['اختر الوكيل حسب حالة الاستخدام من الكتالوج.','جهّز البيئة وتحقق من python3 وnode وgit والإصدارات المطلوبة.','ثبّت من المشروع الأصلي باستخدام تعليماته الدقيقة.','اضبط النموذج ومفتاح API عبر متغيرات البيئة أو مدير الأسرار.','أضف الأدوات والمهارات وMCP بعد التحقق من التوافق والصلاحيات.','شغّل الوكيل داخل workspace مخصص وبأقل صلاحيات؛ استخدم container أو VM للمهام غير الموثوقة.','تحقق من اتصال النموذج والملفات والأدوات والمتصفح والشبكة وGit والسجلات.']:['Choose an agent by use case from the catalog.','Prepare the environment and check python3, node, git and required versions.','Install from the upstream project using its exact instructions.','Configure the model and API key through environment variables or a secret store.','Add tools, skills and MCP only after checking compatibility and permissions.','Run in a dedicated workspace with least privilege; use a container or VM for untrusted tasks.','Verify model connectivity, filesystem, tools, browser/network access, Git credentials and logs.']).map(x=>`<li>${x}</li>`).join('')}</ol><details><summary>${L==='ar'?'مثال عام':'Generic examples'}</summary><div><code class="code"># Python project\npython3 -m venv .venv\nsource .venv/bin/activate\npip install -r requirements.txt\n\n# Node project\nnpm install\n\n# Clone a source repository\ngit clone https://github.com/OWNER/PROJECT.git\ncd PROJECT</code><p class="muted">${L==='ar'?'هذه أمثلة عامة فقط؛ استخدم README الرسمي للوكيل للأمر الدقيق.':'Generic examples only; use the agent’s official README for exact commands.'}</p></div></details><div class="callout"><strong>📱 ${L==='ar'?'Mobile / Termux':'Mobile / Termux'}:</strong> ${L==='ar'?'يمكن تكييف كثير من وكلاء CLI مع Android عبر Termux أو proot أو مضيف Linux بعيد، لكن التوافق خاص بكل وكيل. تحقق من المعمارية وإصدارات Node/Python والمكتبات الأصلية ومتطلبات المتصفح.':'Many CLI agents can be adapted to Android through Termux, proot or a remote Linux host, but compatibility is agent-specific. Check architecture, Node/Python versions, native dependencies and browser requirements.'}</div>`);
html+=section('ranking',`🏆 ${d.rankTitle}`,d.method,`<div class="table-wrap"><table class="table"><thead><tr><th>${L==='ar'?'المعيار':'Criterion'}</th><th>Weight</th><th>${L==='ar'?'ما نراجعه':'What we look at'}</th></tr></thead><tbody>${weights.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div><p class="muted">${d.notBench}</p><div class="grid"><div class="card"><h3>${L==='ar'?'ما ليس عليه الترتيب':'What the ranking is not'}</h3><ul>${(L==='ar'?['ليس ترتيبًا للنماذج.','ليس شهادة أمان.','ليس ضمانًا أن الوكيل الأفضل لكل مهمة.','ليس تأييدًا من المشروع الأصلي.']:['Not a model leaderboard.','Not a security certification.','Not a guarantee that an agent is best for every task.','Not an endorsement by any upstream project.']).map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>${L==='ar'?'سياسة المراجعة':'Review policy'}</h3><p class="muted">${L==='ar'?'يُفضّل تسجيل تاريخ last reviewed وربط الإدخالات بالمصادر الأولية، مع التمييز بين الحقائق والآراء.':'Entries should record a last-reviewed date when possible and link to primary sources, distinguishing verified facts from opinions.'}</p></div></div>`);
html+=section('architecture',`🏗️ ${d.archTitle}`,'',`<code class="code">ai-agents-hub/\n├── agents/              # Agent catalog and evaluation guidance\n├── skills/              # Tools, skills and MCP marketplace\n├── docs/                # Guides, methodology and interactive website\n├── templates/           # Contribution templates\n├── .github/workflows/   # GitHub Pages deployment\n├── README.md            # English entry point\n├── README.ar.md         # Arabic entry point\n├── CONTRIBUTING.md\n├── SECURITY.md\n├── CODE_OF_CONDUCT.md\n├── CHANGELOG.md\n└── LICENSE</code><div class="grid"><div class="card"><h3>Upstream-first</h3><p class="muted">${L==='ar'?'الربط بالمستودعات الأصلية.':'Link to original repositories.'}</p></div><div class="card"><h3>Transparent</h3><p class="muted">${L==='ar'?'شرح المنهجية والتمييز بين الحقائق والآراء.':'Explain methodology and distinguish facts from opinions.'}</p></div><div class="card"><h3>Bilingual</h3><p class="muted">${L==='ar'?'وثائق عربية وإنجليزية متطابقة في النطاق.':'English and Arabic documentation aligned in scope.'}</p></div><div class="card"><h3>Composable</h3><p class="muted">${L==='ar'?'فصل الوكلاء والأدوات والمهارات وMCP لإعادة الاستخدام.':'Catalog agents, tools, skills and MCP separately for reuse.'}</p></div><div class="card"><h3>Security-aware</h3><p class="muted">${L==='ar'?'إظهار الصلاحيات وحدود الثقة المهمة.':'Disclose important permissions and trust boundaries.'}</p></div><div class="card"><h3>Community-driven</h3><p class="muted">${L==='ar'?'المساهمات مرحب بها وقابلة للمراجعة.':'Contributions are welcome and reviewable.'}</p></div></div>`);
html+=section('security',`🔐 ${d.securityTitle}`,'',`<div class="callout"><strong>${L==='ar'?'قاعدة أساسية:':'Core rule:'}</strong> ${L==='ar'?'الوكلاء قد ينفذون أوامر ويعدلون ملفات ويتصلون بالشبكة ويتفاعلون مع خدمات خارجية. استخدم أقل صلاحيات ممكنة، ومساحات عمل معزولة، وبيانات اعتماد قصيرة العمر، وsandbox عند الحاجة.':'Agents may execute commands, modify files, access networks and interact with external services. Use least privilege, isolated workspaces, short-lived credentials and sandboxing where appropriate.'}</div><div class="grid"><div class="card"><h3>🔑 Secrets</h3><p class="muted">${L==='ar'?'لا تضع مفاتيح API أو كلمات المرور أو SSH keys في الكود أو Issues أو PRs.':'Never put API keys, passwords or SSH keys in source code, issues or PRs.'}</p></div><div class="card"><h3>📁 Filesystem</h3><p class="muted">${L==='ar'?'تجنب الوصول غير المقيد للملفات.':'Avoid unrestricted filesystem access.'}</p></div><div class="card"><h3>🌐 Network</h3><p class="muted">${L==='ar'?'راجع وجهات الشبكة والأدوات قبل منحها الثقة.':'Review network destinations and tools before trusting them.'}</p></div><div class="card"><h3>🧪 Third-party</h3><p class="muted">${L==='ar'?'افحص أدوات ومخدمات MCP الخارجية قبل منحها أسرارًا أو وصولًا حساسًا.':'Inspect third-party tools and MCP servers before granting secrets or sensitive access.'}</p></div></div>`);
html+=section('contributing',`🤝 ${d.contribTitle}`,'',`<div class="grid"><div class="card"><h3>${L==='ar'?'ماذا يمكنك إضافة؟':'What can you contribute?'}</h3><p class="muted">${L==='ar'?'وكلاء، أدوات، مهارات، خوادم MCP، أدلة مزودي النماذج، تقارير التوافق، benchmarks، ترجمات ووثائق.':'Agents, tools, skills, MCP servers, provider guides, compatibility reports, benchmarks, translations and documentation.'}</p></div><div class="card"><h3>${L==='ar'?'قواعد الإدراج':'Listing rules'}</h3><p class="muted">${L==='ar'?'أضف المستودع الأصلي، الوثائق الرسمية، الواجهات، طريقة التنصيب، الترخيص وتاريخ آخر مراجعة.':'Include the upstream repository, official docs, interfaces, installation method, license and last-reviewed date.'}</p></div><div class="card"><h3>${L==='ar'?'الترخيص':'License'}</h3><p class="muted">${L==='ar'?'المحتوى الأصلي لهذا الدليل MIT؛ المشاريع الخارجية تحت تراخيصها وعلاماتها التجارية الخاصة.':'Original directory documentation is MIT licensed; third-party projects retain their own licenses and trademarks.'}</p></div></div><p>${source('https://github.com/talbmax10/ai-agents-hub',d.doc)}</p>`);
app.innerHTML=html;footer.innerHTML=`${d.footer} · <a href="https://github.com/talbmax10/ai-agents-hub">GitHub</a> · <a href="#overview">${L==='ar'?'العودة للأعلى ↑':'Back to top ↑'}</a>`;bindSearch();bindDetails();}
function bindSearch(){const s=document.getElementById('search');if(!s)return;s.oninput=()=>{const q=s.value.toLowerCase().trim();document.querySelectorAll('.searchable').forEach(c=>c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q)))}}function bindDetails(){document.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{}));document.getElementById('clear')?.addEventListener('click',()=>{const s=document.getElementById('search');s.value='';s.dispatchEvent(new Event('input'))})}
langBtn.onclick=()=>{L=L==='en'?'ar':'en';localStorage.setItem('lang',L);render();location.hash='overview'};
expandBtn.onclick=()=>{const ds=[...document.querySelectorAll('details')];const open=expandBtn.textContent===langData[L].expand;ds.forEach(x=>x.open=open);expandBtn.textContent=open?langData[L].collapse:langData[L].expand};
document.getElementById('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll',()=>{const ids=['overview','agents','tools','mcp','apis','installation','ranking','architecture','security','contributing'];let current=ids[0];ids.forEach(id=>{const e=document.getElementById(id);if(e&&e.getBoundingClientRect().top<130)current=id});document.querySelectorAll('.quick a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+current))});
render();
</script>
